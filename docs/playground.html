<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HashedBuild terminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%3E%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<!-- The interpreter runs in a worker so its REPL can block on stdin, which
     needs SharedArrayBuffer, which needs cross-origin isolation. GitHub Pages
     cannot set COOP/COEP headers, so this service worker supplies them; it
     reloads the page once, on the first visit. -->
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
  :root {
    --bg: #EEF1F4; --surface: #FFFFFF; --text: #1B2430; --text-dim: #5B6472;
    --border: #D6DCE2; --accent: #B96A1F; --ok: #2F7D46; --err: #B3392F;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0E1116; --surface: #12161D; --text: #E7E9EC; --text-dim: #8B95A3;
      --border: #262D38; --accent: #E0954A; --ok: #63B37B; --err: #E4776B;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0E1116; --surface: #12161D; --text: #E7E9EC; --text-dim: #8B95A3;
    --border: #262D38; --accent: #E0954A; --ok: #63B37B; --err: #E4776B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: var(--sans); display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--accent);
  }
  header .spacer { flex: 1; }
  header a { color: var(--accent); font-size: 13px; }
  #screen {
    flex: 1; margin: 0; padding: 16px 20px 8px; overflow-y: auto; cursor: text;
    font-family: var(--mono); font-size: 13px; line-height: 1.55;
    background: var(--surface); white-space: pre-wrap; word-break: break-word;
  }
  #screen .err { color: var(--err); }
  #screen .dim { color: var(--text-dim); }
  #screen .accent { color: var(--accent); }
  .line { display: flex; gap: 0; align-items: baseline; }
  .prompt { color: var(--accent); white-space: pre; }
  #entry {
    flex: 1; border: 0; outline: none; padding: 0; background: transparent;
    color: var(--text); font: inherit; caret-color: var(--accent);
  }
  #inputline {
    display: flex; gap: 0; align-items: baseline; padding: 0 20px 16px;
    background: var(--surface); font-family: var(--mono); font-size: 13px;
  }
  footer {
    padding: 8px 20px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim); display: flex; gap: 16px; flex-wrap: wrap;
  }
  kbd {
    font-family: var(--mono); font-size: 11px; border: 1px solid var(--border);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 4px;
  }
  /* The live editor draws a full-screen TUI, so it gets a real terminal
     emulator rather than the line-oriented shell above. Hidden until `hb -i`
     asks for it, and xterm.js is only fetched at that point. */
  #tui { display: none; flex: 1; padding: 8px 12px; background: var(--surface); min-height: 0; }
  body.tui #screen, body.tui #inputline { display: none; }
  body.tui #tui { display: block; }
</style>
</head>
<body>
<header>
  <div>
    <div class="eyebrow">HashedBuild</div>
    <h1>Terminal</h1>
  </div>
  <div class="spacer"></div>
  <a href="index.html">Home</a>
  <a href="https://github.com/janstrakowski/hashedbuild/blob/main/LANGUAGE.md">Language tour</a>
  <a href="SPEC.html">Spec</a>
</header>

<pre id="screen"></pre>
<div id="tui"></div>
<div id="inputline">
  <span class="prompt" id="prompt">$ </span>
  <input id="entry" spellcheck="false" autocapitalize="off" autocorrect="off" autocomplete="off" autofocus>
</div>

<footer>
  <span><kbd>↑</kbd><kbd>↓</kbd> history · <kbd>Ctrl</kbd>+<kbd>L</kbd> clears</span>
  <span>Type <span class="accent">help</span> to start.</span>
  <span>The interpreter is WebAssembly running in this tab; files persist in your browser.</span>
</footer>

<script type="module">
// The page is the terminal; the interpreter lives in terminal-worker.js. The
// split is what makes `hb` genuinely interactive: its REPL blocks on stdin,
// and only a worker can block without freezing the tab.

const screen = document.getElementById("screen");
const entry = document.getElementById("entry");
const promptEl = document.getElementById("prompt");

// Shared with the worker: [0] is the state it waits on, [1] the byte length.
// Created only once the page is cross-origin isolated - on the first visit it
// is not, and SharedArrayBuffer does not exist at all, so touching it here
// would kill the module before it could explain itself.
const STATE_EMPTY = 0, STATE_DATA = 1, STATE_EOF = 2;
let control, inputBuffer, controlView, inputView, worker;

function startWorker() {
  control = new SharedArrayBuffer(8);
  inputBuffer = new SharedArrayBuffer(8192);
  controlView = new Int32Array(control);
  inputView = new Uint8Array(inputBuffer);

  worker = new Worker("terminal-worker.js", { type: "module" });
  worker.onmessage = onWorkerMessage;
  setRunning(true);
  worker.postMessage({ type: "boot", control, input: inputBuffer });
}

let history = [];
let historyIndex = 0;
let running = false;        // a command is executing
let awaitingInput = false;  // ...and it is blocked reading stdin
let rawMode = false;        // ...and it is a TUI, drawing into xterm.js
let resolveCommand = null;

// ---- output ---------------------------------------------------------------

function write(text, cls) {
  const span = document.createElement("span");
  if (cls) span.className = cls;
  span.textContent = text;
  screen.append(span);
  screen.scrollTop = screen.scrollHeight;
}

const writeLine = (text = "", cls) => write(text + "\n", cls);

// ---- talking to the worker -------------------------------------------------

function onWorkerMessage(event) {
  const message = event.data;
  switch (message.type) {
    case "ready":
      history = message.history ?? [];
      historyIndex = history.length;
      writeLine(message.restored
        ? "Restored your files from this browser."
        : "This is the repository, as if you had cloned it. Type `help`, or `ls`.", "dim");
      writeLine();
      setRunning(false);
      break;

    case "stdout":
      if (rawMode) term.write(message.text);
      else write(message.text);
      break;
    case "stderr":
      if (rawMode) term.write(message.text);
      else write(message.text, "err");
      break;

    // The program is blocked reading stdin: hand the prompt back so the
    // visitor can answer it. The interpreter has already printed its own
    // prompt ("hb> ") by this point.
    case "waiting-for-input":
      awaitingInput = true;
      // In raw mode the emulator already has focus and forwards every
      // keystroke; the page's own prompt stays out of the way.
      if (!rawMode) setRunning(false, "");
      break;

    case "done":
      awaitingInput = false;
      finishCommand();
      break;

    case "listing":
      if (message.entries.length === 0) writeLine("(nothing here)", "dim");
      for (const entry of message.entries) {
        const pad = " ".repeat(Math.max(1, 40 - entry.path.length));
        writeLine(`  ${entry.path}${pad}${entry.detail}`, entry.kind === "dir" ? "dim" : undefined);
      }
      finishCommand();
      break;

    case "cat":
      if (message.error) writeLine(`cat: ${message.error}`, "err");
      else {
        write(message.text);
        if (message.text.length && !message.text.endsWith("\n")) writeLine();
      }
      finishCommand();
      break;

    case "reset-done":
      history = [];
      writeLine("starting files restored", "dim");
      finishCommand();
      break;
  }
}

function finishCommand() {
  if (resolveCommand) resolveCommand();
  resolveCommand = null;
  setRunning(false);
}

function ask(message) {
  return new Promise((resolve) => {
    resolveCommand = resolve;
    setRunning(true);
    worker.postMessage(message);
  });
}

// Writes a line into the shared buffer and wakes the worker, which is sitting
// in Atomics.wait inside its stdin read.
function sendToStdin(line, appendNewline = true) {
  const bytes = new TextEncoder().encode(appendNewline ? line + "\n" : line);
  inputView.set(bytes.subarray(0, inputView.length));
  Atomics.store(controlView, 1, Math.min(bytes.length, inputView.length));
  Atomics.store(controlView, 0, STATE_DATA);
  Atomics.notify(controlView, 0);
}

function sendEof() {
  Atomics.store(controlView, 0, STATE_EOF);
  Atomics.notify(controlView, 0);
}

// ---- the live editor, on a real terminal emulator ---------------------------
//
// `hb -i` draws a full-screen TUI: cursor moves, alternate screen, colour. The
// line-oriented shell above cannot render that, so it hands over to xterm.js -
// loaded here, on first use, rather than on every visit for the sake of a
// feature most visitors never open.

let term = null;
let fitAddon = null;

async function ensureTerminalEmulator() {
  if (term) return term;
  await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "vendor/xterm.js";
    script.onload = resolve;
    script.onerror = () => reject(new Error("could not load vendor/xterm.js"));
    document.head.append(script);
  });
  await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = "vendor/xterm-addon-fit.js";
    script.onload = resolve;
    script.onerror = () => reject(new Error("could not load the fit addon"));
    document.head.append(script);
  });

  const styles = getComputedStyle(document.documentElement);
  term = new window.Terminal({
    fontFamily: styles.getPropertyValue("--mono").trim() || "monospace",
    fontSize: 13,
    cursorBlink: true,
    theme: {
      background: styles.getPropertyValue("--surface").trim(),
      foreground: styles.getPropertyValue("--text").trim(),
      cursor: styles.getPropertyValue("--accent").trim(),
    },
  });
  fitAddon = new window.FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("tui"));

  // Every keystroke goes straight to the program: no echo, no line editing.
  // That is what raw mode means, and the editor is doing its own drawing.
  term.onData((data) => {
    if (rawMode) sendToStdin(data, false);
  });
  return term;
}

// The editor asks the host for its size (term_size in term_wasi.odin reads
// COLUMNS/LINES), so the numbers have to be settled before the program starts.
async function runInteractive(args) {
  await ensureTerminalEmulator();
  document.body.classList.add("tui");
  fitAddon.fit();
  term.clear();
  term.focus();
  rawMode = true;

  await ask({ type: "hb", args, tui: { columns: term.cols, rows: term.rows } });

  rawMode = false;
  document.body.classList.remove("tui");
  writeLine("(left the editor)", "dim");
}

// ---- the shell -------------------------------------------------------------

const HELP = `This is the HashedBuild CLI, compiled to WebAssembly. The filesystem is the
repository as it stands, and anything you write to it stays in this browser.

  hb                 the REPL - an expression, then a blank line, ':q' to quit
  hb <file>          run a program, e.g. hb examples/guard-chain.hb
  hb -e '<expr>'     evaluate one expression
  hb -a <file>       print the AST before evaluating
  hb --help          the interpreter's own usage
  ls [path]          list files
  cat <file>         print a file, e.g. cat SPEC.md
  clear              clear the screen
  reset              restore the repository, discarding anything written

Programs written with createfile land in the filesystem; ctx.cache writes to
/cache/hashedbuild. Ctrl+D sends end-of-input to a running program.`;

function tokenize(line) {
  const out = [];
  const re = /'([^']*)'|"([^"]*)"|(\S+)/g;
  let m;
  while ((m = re.exec(line)) !== null) out.push(m[1] ?? m[2] ?? m[3]);
  return out;
}

async function runCommand(line) {
  const args = tokenize(line);
  if (args.length === 0) return;

  switch (args[0]) {
    case "help": writeLine(HELP); return;
    case "clear": screen.replaceChildren(); return;
    case "ls": await ask({ type: "ls", path: args[1] }); return;
    case "cat":
      if (!args[1]) return writeLine("cat: needs a file", "err");
      await ask({ type: "cat", path: args[1] });
      return;
    case "reset": await ask({ type: "reset" }); return;
    case "hb": {
      const hbArgs = args.slice(1);
      // -i is the flag that means "full-screen TUI"; nothing else in the CLI
      // needs a terminal emulator, so nothing else pays for one.
      if (hbArgs.some((a) => a === "-i" || a === "--interactive")) await runInteractive(hbArgs);
      else await ask({ type: "hb", args: hbArgs });
      return;
    }
    default: writeLine(`${args[0]}: not a command. Try \`help\`.`, "err");
  }
}

// ---- input -----------------------------------------------------------------

function setRunning(value, promptText) {
  running = value;
  entry.disabled = value;
  promptEl.textContent = value ? "  " : (promptText ?? "$ ");
  if (!value) entry.focus();
}

entry.addEventListener("keydown", async (event) => {
  if (event.ctrlKey && event.key.toLowerCase() === "l") {
    event.preventDefault();
    screen.replaceChildren();
    return;
  }

  // Ctrl+D: end-of-input for whatever is reading stdin, exactly as it would be
  // in a real terminal.
  if (event.ctrlKey && event.key.toLowerCase() === "d") {
    event.preventDefault();
    if (awaitingInput) {
      writeLine();
      awaitingInput = false;
      setRunning(true);
      sendEof();
    }
    return;
  }

  if (event.key === "ArrowUp" || event.key === "ArrowDown") {
    if (history.length === 0) return;
    event.preventDefault();
    historyIndex += event.key === "ArrowUp" ? -1 : 1;
    historyIndex = Math.max(0, Math.min(history.length, historyIndex));
    entry.value = history[historyIndex] ?? "";
    return;
  }

  if (event.key !== "Enter" || running) return;
  event.preventDefault();

  const line = entry.value;
  entry.value = "";

  // While a program is reading stdin, the line belongs to it - the program is
  // printing its own prompts, so the page only echoes what was typed.
  if (awaitingInput) {
    writeLine(line);
    awaitingInput = false;
    setRunning(true);
    sendToStdin(line);
    return;
  }

  write("$ ", "accent");
  writeLine(line);
  if (line.trim()) {
    history.push(line);
    historyIndex = history.length;
    worker.postMessage({ type: "history", history: history.slice(-100) });
  }
  await runCommand(line);
});

screen.addEventListener("mouseup", () => {
  if (!window.getSelection().toString()) entry.focus();
});

// ---- boot ------------------------------------------------------------------

writeLine("HashedBuild — the CLI, compiled to WebAssembly, running here.", "dim");

// Cross-origin isolation is what makes SharedArrayBuffer - and therefore
// blocking stdin - available at all. coi-serviceworker installs the headers
// and reloads once, but it skips that reload while the service worker itself
// is updating (it leaves "coiReloadedBySelf: updatefound" behind and waits for
// the *next* load), which would otherwise strand the page on a dead prompt.
// So retry here too, capped, and say something honest if it never arrives.
const RETRY_KEY = "hb-isolation-retries";
if (self.crossOriginIsolated) {
  sessionStorage.removeItem(RETRY_KEY);
  startWorker();
} else {
  const tries = Number(sessionStorage.getItem(RETRY_KEY) ?? "0");
  setRunning(true, "  ");
  if (tries < 3) {
    sessionStorage.setItem(RETRY_KEY, String(tries + 1));
    writeLine("Setting up (the page reloads itself once)…", "dim");
    setTimeout(() => location.reload(), 400);
  } else {
    writeLine("This browser will not enable cross-origin isolation, which the terminal needs "
      + "for interactive input (SharedArrayBuffer). Nothing can run here.", "err");
  }
}
</script>
</body>
</html>
