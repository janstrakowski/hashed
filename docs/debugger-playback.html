<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debugger Playback</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #EEF1F4;
    --surface: #FFFFFF;
    --surface-2: #E4E9EE;
    --text: #1B2430;
    --text-dim: #5B6472;
    --border: #D6DCE2;
    --accent: #B96A1F;
    --accent-ink: #FFFFFF;
    --danger: #B3261E;
    --term-bg: #0B0D10;
    --term-text: #E8E6E1;
    --term-dim: #6B7178;
    --term-accent: #E0954A;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151B;
      --surface: #191E26;
      --surface-2: #20262F;
      --text: #E7E9EC;
      --text-dim: #8B95A3;
      --border: #2B323C;
      --accent: #E0954A;
      --accent-ink: #1B1204;
      --danger: #E5877E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151B;
    --surface: #191E26;
    --surface-2: #20262F;
    --text: #E7E9EC;
    --text-dim: #8B95A3;
    --border: #2B323C;
    --accent: #E0954A;
    --accent-ink: #1B1204;
    --danger: #E5877E;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    text-wrap: balance;
  }
  .app {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .brand {
    padding: 20px 20px 14px;
    border-bottom: 1px solid var(--border);
  }
  .brand .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .brand h1 {
    margin: 4px 0 0;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .brand p {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--text-dim);
    line-height: 1.5;
  }
  nav.list {
    list-style: none;
    margin: 0;
    padding: 8px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .item {
    display: flex;
    flex-direction: column;
    gap: 3px;
    padding: 9px 12px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    text-align: left;
    background: none;
    color: inherit;
    font-family: inherit;
    width: 100%;
  }
  .item:hover { background: var(--surface-2); }
  .item.active {
    background: var(--surface-2);
    border-color: var(--border);
  }
  .item .name {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 500;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }
  .item .name .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .name .count {
    font-size: 10.5px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
    flex: none;
  }
  .item .blurb {
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .item.has-error .name .fname::before {
    content: "";
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--danger);
    margin-right: 6px;
    vertical-align: middle;
  }
  .sidebar-foot {
    margin-top: auto;
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
  }

  main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 22px 26px 26px;
    gap: 16px;
  }
  .header-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .header-row h2 {
    margin: 0;
    font-family: var(--mono);
    font-size: 18px;
    font-weight: 600;
  }
  .header-row .blurb-full {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--text-dim);
    max-width: 62ch;
    line-height: 1.5;
  }
  .error-banner {
    display: none;
    background: color-mix(in srgb, var(--danger) 14%, var(--surface));
    border: 1px solid var(--danger);
    color: var(--text);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
  .error-banner.show { display: block; }

  .transport {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
  }
  .transport button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 7px;
    padding: 7px 12px;
    cursor: pointer;
  }
  .transport button:hover { border-color: var(--accent); }
  .transport button:focus-visible, .item:focus-visible, input[type=range]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .transport button.play { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .transport .step-label {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-dim);
    min-width: 96px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .transport .frame-label {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--accent);
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .transport input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }

  .term-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    overflow-x: auto;
    flex: 1;
    min-height: 0;
  }
  .term {
    display: inline-block; /* shrink-to-fit the wide (200-col) <pre> so the
      dark background covers its full width, not just the visible viewport -
      otherwise content past the fold shows on the page's own background */
    min-width: 100%;
    background: var(--term-bg);
    border-radius: 8px;
    padding: 16px 18px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
  }
  .term pre {
    margin: 0;
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--term-text);
    white-space: pre;
    width: max-content;
  }
  .term .glyph { color: var(--term-accent); font-weight: 600; }
  .term .dim { color: var(--term-dim); }

  .hint {
    font-size: 11.5px;
    color: var(--text-dim);
    text-align: right;
  }
  .hint kbd {
    font-family: var(--mono);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10.5px;
  }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--border); max-height: 40vh; }
  }
</style>

</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="eyebrow">HashedBuild</div>
      <h1>Debugger Playback</h1>
      <p>Every example, stepped through the live editor's pausable debugger and captured frame by frame from a real headless terminal.</p>
    </div>
    <nav class="list" id="list" role="listbox" aria-label="Examples"></nav>
    <div class="sidebar-foot" id="summary"></div>
  </aside>
  <main>
    <div class="header-row">
      <div>
        <h2 id="ex-name">—</h2>
        <p class="blurb-full" id="ex-blurb"></p>
      </div>
    </div>
    <div class="error-banner" id="error-banner"></div>
    <div class="transport">
      <button id="btn-prev" aria-label="Previous frame">◀ Prev</button>
      <button id="btn-play" class="play" aria-label="Play">▶ Play</button>
      <button id="btn-next" aria-label="Next frame">Next ▶</button>
      <span class="step-label" id="step-label">0 / 0</span>
      <input type="range" id="scrubber" min="0" max="0" value="0" aria-label="Frame scrubber">
      <span class="frame-label" id="frame-label"></span>
    </div>
    <div class="term-wrap">
      <div class="term"><pre id="screen"></pre></div>
    </div>
    <div class="hint">Arrow keys or <kbd>J</kbd>/<kbd>K</kbd> to step · <kbd>Space</kbd> to play/pause · <kbd>1</kbd>-<kbd>9</kbd> to jump to an example</div>
  </main>
</div>

<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);

  var listEl = document.getElementById("list");
  var exNameEl = document.getElementById("ex-name");
  var exBlurbEl = document.getElementById("ex-blurb");
  var errorBanner = document.getElementById("error-banner");
  var screenEl = document.getElementById("screen");
  var stepLabelEl = document.getElementById("step-label");
  var frameLabelEl = document.getElementById("frame-label");
  var scrubber = document.getElementById("scrubber");
  var summaryEl = document.getElementById("summary");
  var btnPrev = document.getElementById("btn-prev");
  var btnNext = document.getElementById("btn-next");
  var btnPlay = document.getElementById("btn-play");

  var current = 0;
  var frameIdx = 0;
  var playing = false;
  var playTimer = null;

  var errCount = DATA.filter(function (e) { return e.error; }).length;
  summaryEl.textContent = DATA.length + " examples captured" +
    (errCount ? " · " + errCount + " with issues" : " · all clean");

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  var GLYPH_RE = /([✂∅▶⏳→])/g;
  function renderLine(line) {
    var escaped = escapeHtml(line);
    return escaped.replace(GLYPH_RE, '<span class="glyph">$1</span>');
  }

  function buildList() {
    DATA.forEach(function (ex, i) {
      var btn = document.createElement("button");
      btn.className = "item" + (ex.error ? " has-error" : "");
      btn.setAttribute("role", "option");
      btn.innerHTML =
        '<span class="name"><span class="fname"></span><span class="count">' +
        ex.frames.length + " frames</span></span>" +
        '<span class="blurb"></span>';
      btn.querySelector(".fname").textContent = ex.name;
      btn.querySelector(".blurb").textContent = ex.blurb;
      btn.addEventListener("click", function () { selectExample(i); });
      listEl.appendChild(btn);
    });
  }

  function selectExample(i) {
    current = i;
    frameIdx = 0;
    stopPlay();
    Array.prototype.forEach.call(listEl.children, function (el, idx) {
      el.classList.toggle("active", idx === i);
    });
    var ex = DATA[i];
    exNameEl.textContent = ex.name;
    exBlurbEl.textContent = ex.blurb;
    if (ex.error) {
      errorBanner.textContent = "⚠ " + ex.error;
      errorBanner.classList.add("show");
    } else {
      errorBanner.classList.remove("show");
    }
    scrubber.max = ex.frames.length - 1;
    renderFrame();
  }

  function renderFrame() {
    var ex = DATA[current];
    var frame = ex.frames[frameIdx];
    screenEl.innerHTML = frame.lines.map(renderLine).join("\n");
    stepLabelEl.textContent = (frameIdx + 1) + " / " + ex.frames.length;
    frameLabelEl.textContent = frame.label;
    scrubber.value = frameIdx;
  }

  function step(delta) {
    var ex = DATA[current];
    frameIdx = Math.max(0, Math.min(ex.frames.length - 1, frameIdx + delta));
    renderFrame();
  }

  function stopPlay() {
    playing = false;
    btnPlay.textContent = "▶ Play";
    btnPlay.classList.remove("playing");
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
  }

  function togglePlay() {
    if (playing) { stopPlay(); return; }
    var ex = DATA[current];
    if (frameIdx >= ex.frames.length - 1) frameIdx = 0;
    playing = true;
    btnPlay.textContent = "⏸ Pause";
    playTimer = setInterval(function () {
      var ex2 = DATA[current];
      if (frameIdx >= ex2.frames.length - 1) { stopPlay(); return; }
      frameIdx += 1;
      renderFrame();
    }, 700);
  }

  btnPrev.addEventListener("click", function () { stopPlay(); step(-1); });
  btnNext.addEventListener("click", function () { stopPlay(); step(1); });
  btnPlay.addEventListener("click", togglePlay);
  scrubber.addEventListener("input", function () {
    stopPlay();
    frameIdx = parseInt(scrubber.value, 10) || 0;
    renderFrame();
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && (e.target.tagName === "INPUT")) return;
    if (e.key === "ArrowRight" || e.key === "j" || e.key === "J") { stopPlay(); step(1); }
    else if (e.key === "ArrowLeft" || e.key === "k" || e.key === "K") { stopPlay(); step(-1); }
    else if (e.key === " ") { e.preventDefault(); togglePlay(); }
    else if (e.key >= "1" && e.key <= "9") {
      var idx = parseInt(e.key, 10) - 1;
      if (idx < DATA.length) selectExample(idx);
    }
  });

  buildList();
  selectExample(0);
})();
</script>
