name: CI

# main is the branch that has to stay green (see CLAUDE.md): every commit on
# it builds and passes the whole suite. dev is deliberately left out - it
# carries WIP commits that are allowed to be broken, and a permanent red X
# there would train everyone to ignore the badge. Add `dev` to the push
# branches if you ever want a signal on WIP too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Same release the project is developed against; bump deliberately, so
      # a compiler change shows up as its own commit rather than as a
      # mystery failure on an unrelated PR.
      ODIN_VERSION: dev-2026-08
    steps:
      - uses: actions/checkout@v7

      # The release tarball's top-level directory is named after the nightly
      # it was cut from (odin-linux-amd64-nightly+2026-08-06), not after the
      # tag, so strip it rather than trying to predict it.
      - name: Cache Odin
        id: cache-odin
        uses: actions/cache@v6
        with:
          path: ~/odin
          key: odin-linux-amd64-${{ env.ODIN_VERSION }}

      - name: Install Odin ${{ env.ODIN_VERSION }}
        if: steps.cache-odin.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/odin"
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            | tar xz -C "$HOME/odin" --strip-components=1

      - name: Put Odin on PATH
        run: echo "$HOME/odin" >> "$GITHUB_PATH"

      # Odin shells out to clang to link. The runner images ship it, but
      # that's their choice to change, and a missing linker is a confusing
      # failure to debug from a build log.
      - name: Ensure clang is present
        run: |
          if ! command -v clang >/dev/null; then
            sudo apt-get update && sudo apt-get install -y clang
          fi

      - run: odin version

      - name: Build
        run: odin build src -out:hb

      - name: Test
        run: odin test src -out:/tmp/hbtest

  # The Odin suite only ever builds natively, so nothing in it can execute
  # fs_wasi.odin. This job builds the WASI target and checks the examples
  # produce the same values there as they do native - the one thing that
  # actually covers the second backend.
  wasi:
    runs-on: ubuntu-latest
    env:
      ODIN_VERSION: dev-2026-08
    steps:
      - uses: actions/checkout@v7

      - name: Cache Odin
        id: cache-odin
        uses: actions/cache@v6
        with:
          path: ~/odin
          key: odin-linux-amd64-${{ env.ODIN_VERSION }}

      - name: Install Odin ${{ env.ODIN_VERSION }}
        if: steps.cache-odin.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/odin"
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            | tar xz -C "$HOME/odin" --strip-components=1

      - name: Put Odin on PATH
        run: echo "$HOME/odin" >> "$GITHUB_PATH"

      # wasm-ld links the wasm32 build and comes from lld, which the runner
      # images don't ship even though they do ship clang. Odin reports its
      # absence as a bare "sh: 1: wasm-ld: not found", so it is checked for by
      # name here rather than assumed to arrive with the compiler.
      - name: Ensure clang and wasm-ld are present
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          command -v wasm-ld >/dev/null || missing="$missing lld"
          if [ -n "$missing" ]; then
            sudo apt-get update && sudo apt-get install -y $missing
          fi
          wasm-ld --version

      # Pinned like Odin is: a runtime upgrade should be its own commit, not a
      # surprise on an unrelated PR.
      - name: Install wasmtime
        env:
          WASMTIME_VERSION: v48.0.1
        run: |
          mkdir -p "$HOME/wasmtime"
          curl -fsSL "https://github.com/bytecodealliance/wasmtime/releases/download/${WASMTIME_VERSION}/wasmtime-${WASMTIME_VERSION}-x86_64-linux.tar.xz" \
            | tar xJ -C "$HOME/wasmtime" --strip-components=1
          echo "$HOME/wasmtime" >> "$GITHUB_PATH"

      # -o:size, not the default: Odin's default for this target is
      # -o:minimal, which on dev-2026-08 emits a wasm module that fails
      # validation (a type mismatch inside eval_check). -o:none/-o:size/
      # -o:speed are all fine, and size is what a browser wants anyway.
      - name: Build native and portable WASI
        run: |
          odin build src -out:hb
          scripts/build_wasi.sh -out:hb.wasm

      - name: Examples agree on both targets
        run: scripts/wasi_smoke.sh ./hb ./hb.wasm "$(command -v wasmtime)"

  # The threaded WASI build can't be exercised by the job above: it imports
  # wasi.thread-spawn, which wasmtime dropped in June 2026, so it needs an
  # engine that still implements the proposal. WAMR is that engine - its
  # maintainers are the ones keeping wasi-threads alive - and it has to be
  # built, since no release ships an iwasm with the thread manager enabled.
  wasi-threads:
    runs-on: ubuntu-latest
    env:
      ODIN_VERSION: dev-2026-08
      # Pinned like everything else; a runtime bump should be its own commit.
      WAMR_COMMIT: 16ea74cc6f3671d81db2c4a8dac08fba6eadc73b
    steps:
      - uses: actions/checkout@v7

      - name: Cache Odin
        id: cache-odin
        uses: actions/cache@v6
        with:
          path: ~/odin
          key: odin-linux-amd64-${{ env.ODIN_VERSION }}

      - name: Install Odin ${{ env.ODIN_VERSION }}
        if: steps.cache-odin.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/odin"
          curl -fsSL "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            | tar xz -C "$HOME/odin" --strip-components=1

      - name: Put Odin on PATH
        run: echo "$HOME/odin" >> "$GITHUB_PATH"

      - name: Ensure clang and wasm-ld are present
        run: |
          missing=""
          command -v clang >/dev/null || missing="$missing clang"
          command -v wasm-ld >/dev/null || missing="$missing lld"
          if [ -n "$missing" ]; then
            sudo apt-get update && sudo apt-get install -y $missing
          fi

      - name: Cache iwasm
        id: cache-iwasm
        uses: actions/cache@v6
        with:
          path: ~/iwasm
          key: iwasm-${{ env.WAMR_COMMIT }}

      - name: Build iwasm with wasi-threads
        if: steps.cache-iwasm.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/bytecodealliance/wasm-micro-runtime /tmp/wamr
          git -C /tmp/wamr checkout "$WAMR_COMMIT"
          cmake -S /tmp/wamr/product-mini/platforms/linux -B /tmp/wamr/build \
            -DWAMR_BUILD_LIBC_WASI=1 -DWAMR_BUILD_LIB_WASI_THREADS=1 \
            -DWAMR_BUILD_SHARED_MEMORY=1 -DWAMR_BUILD_THREAD_MGR=1 -DWAMR_BUILD_BULK_MEMORY=1
          make -C /tmp/wamr/build -j"$(nproc)"
          mkdir -p "$HOME/iwasm"
          cp /tmp/wamr/build/iwasm-* "$HOME/iwasm/iwasm"

      - name: Build native and threaded WASI
        run: |
          odin build src -out:hb
          scripts/build_wasi.sh --threads -out:hb-threads.wasm

      # --stack-size: iwasm defaults to 64 KB of operand stack, which the
      # evaluator's recursion outgrows on the larger examples.
      - name: Examples agree with real threads
        run: scripts/wasi_smoke.sh ./hb ./hb-threads.wasm "$HOME/iwasm/iwasm" --stack-size=4194304 --max-threads=8
